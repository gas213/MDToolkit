spack:
  config:
    # Put required files in project space, and the rest (build files and caches only required during installation) in scratch
    install_tree:
      root: ${PROJECT}/spack/install_tree
    build_stage:
    - ${SCRATCH}/spack_safetodelete/build_stage
    test_stage: ${SCRATCH}/spack_safetodelete/test_stage
    source_cache: ${SCRATCH}/spack_safetodelete/source_cache
    misc_cache: ${PROJECT}/spack/misc_cache
  bootstrap:
    root: ${SCRATCH}/spack_safetodelete/bootstrap
  specs:
  - gzip
  - netcdf-c
  - lammps@20250722 +compress +mpi +netcdf cflags="-D WITH_GZIP=ON" cxxflags="-D WITH_GZIP=ON"
  view: true
  concretizer:
    unify: when_possible
  packages:
    all:
      target: [x86_64]